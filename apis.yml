name: Beryllium
description: 'Beryllium was a Singapore- and Delhi-based sports and trading game development
  platform founded in 2018/2019 by Amay Makhija, best known for its consumer product
  Sixer — a fantasy cricket game where users bought "Up" or "Down" virtual stocks in
  professional cricketers, with prices moving on in-game batting, bowling, and fielding
  metrics. The company raised roughly $3.6M across two rounds, including a $3M pre-Series
  A in June 2021 led by Bullpen Capital with Genting Ventures and Velo Partners. Beryllium
  was acquired by Dream Sports (Dream11) in October 2023. As of this enrichment pass the
  company is defunct as an independent operator: sixer.gg no longer resolves in DNS, and
  beryllium.ai is a parked domain listed for sale on the GoDaddy/Afternic aftermarket.
  Beryllium never published a public API, developer portal, or SDKs, so there is no API
  surface for the API Evangelist network to catalog.'
